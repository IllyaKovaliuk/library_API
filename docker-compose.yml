services:
  db:
    image: postgres:14
    volumes:
      - ./data/db:/var/lib/postgresql/data
    env_file:
      - .env

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./:/code
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  redis:
    image: "redis"
    env_file:
      - .env

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "celery -A library worker -l info"
    depends_on:
      - redis
      - web
      - db
    restart: on-failure
    env_file:
      - .env

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5555:5555"
    command: >
      sh -c "celery --broker=redis://redis:6379/0 flower"
    depends_on:
      - celery
    env_file:
      - .env